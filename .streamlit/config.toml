# Farbschema im Stil von No Man's Sky für alle Streamlit-Elemente (auch Pop-ups und Eingabefelder)
[theme]
base = "dark"
primaryColor = "#ffb321"
backgroundColor = "#07050f"
secondaryBackgroundColor = "#1a1430"
textColor = "#f6f1e7"
borderColor = "#3b3360"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
